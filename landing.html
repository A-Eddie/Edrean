<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edrean Ochieng — Engineer & Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    :root {
      --ink:    #0a0a0a;
      --paper:  #fafaf8;
      --muted:  #6b6b6b;
      --accent: #d65c42;
      --accent2: #3b5bdb;
      --accent3: #1fa876;
      --line:   rgba(0,0,0,0.08);
      --line-light: rgba(0,0,0,0.04);
      --card-bg: #ffffff;
    }

    html { 
      scroll-behavior: smooth; 
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #fafaf8 0%, #f5f2f0 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── SUBTLE TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(214, 92, 66, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 91, 219, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 9999;
      opacity: 1;
    }

    /* ── LANDING PAGE ── */
    .landing-container {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      position: relative;
      z-index: 1;
      padding: 2rem;
    }

    .landing-logo {
      width: 100%;
      max-width: 300px;
      height: auto;
      object-fit: contain;
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    .landing-tagline {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-align: center;
      max-width: 500px;
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
    }

    .landing-tagline span {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .landing-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--ink) 0%, var(--muted) 100%);
      color: var(--card-bg);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both;
      margin-top: 1rem;
    }

    .landing-button:hover {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      transform: translateY(-3px);
      box-shadow: 0 20px 48px rgba(0,0,0,0.12);
    }

    .landing-scroll {
      position: absolute;
      bottom: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      animation: bounce 2s ease-in-out infinite 0.8s;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(32px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 100% { 
        transform: translateY(0); 
        opacity: 0.7; 
      }
      50% { 
        transform: translateY(-8px); 
        opacity: 1; 
      }
    }

    @media (max-width: 560px) {
      .landing-container {
        gap: 1.5rem;
      }
      .landing-logo {
        max-width: 240px;
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <img src="images/edrean-ochieng-logo.png" alt="Edrean Ochieng" class="landing-logo" />
    <div class="landing-tagline">Engineer • Developer • <span>Designer</span></div>
    <a href="index.html" class="landing-button">Enter Site →</a>
    <div class="landing-scroll">or scroll down</div>
  </div>
</body>
</html>
